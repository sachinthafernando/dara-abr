# conda env create -f environment.yml && conda activate dara-abr
# For a CUDA build of PyTorch, replace the pytorch line following https://pytorch.org/get-started/locally/
name: dara-abr
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pytorch>=2.0
  - numpy>=1.24
  - pandas>=1.5
  - scipy>=1.10
  - matplotlib>=3.4
  - papermill>=2.4
  - ipykernel>=6.0
  - pytest>=7
